<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Posting Otomatis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#243244; --text:#e2e8f0; --muted:#94a3b8;
  --fb:#3b5998; --ig1:#f09433; --ig2:#dc2743; --ig3:#bc1888;
  --ok:#22c55e; --err:#ef4444; --accent:#38bdf8;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(160deg,#0f172a,#1e293b);color:var(--text);padding:24px;}
.header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-bottom:20px;}
.header h1{margin:0;font-size:26px;font-weight:700;background:linear-gradient(90deg,var(--accent),#818cf8);-webkit-background-clip:text;color:transparent;}
.tanggal{text-align:right;color:var(--muted);font-size:13px;}
.jam{font-size:24px;font-weight:700;color:var(--text);}
.badge-demo{display:inline-block;background:#334155;color:var(--accent);font-size:11px;padding:3px 10px;border-radius:20px;margin-left:8px;}
.panel{background:var(--panel);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,0.35);}
.status-panel{display:flex;align-items:center;gap:10px;font-weight:600;}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.aktif{background:var(--ok);box-shadow:0 0 8px var(--ok);}
.dot.nonaktif{background:var(--err);}
.cards{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px;}
.card{flex:1;min-width:150px;background:var(--panel2);border-radius:14px;padding:18px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.3);}
.card h2{margin:0;font-size:28px;color:var(--accent);}
.card p{margin:6px 0 0;font-size:13px;color:var(--muted);}
.progress-wrap{background:var(--panel);border-radius:14px;padding:16px 20px;margin-bottom:16px;}
.progress-label{font-size:13px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:6px;}
.progress-bar{background:#334155;border-radius:8px;height:10px;overflow:hidden;}
.progress-fill{height:100%;border-radius:8px;transition:width .5s ease;width:0;}
.fb{background:var(--fb);} .ig{background:linear-gradient(90deg,var(--ig1),var(--ig2),var(--ig3));}
.main-content{display:flex;gap:16px;flex-wrap:wrap;}
.table-wrap{flex:3;min-width:320px;background:var(--panel);border-radius:14px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th,td{padding:12px;text-align:left;font-size:13px;border-bottom:1px solid #334155;}
th{background:var(--panel2);color:var(--accent);}
tr:hover{background:#22314654;}
.link-posted{color:var(--ok);font-weight:600;}
.status-error{color:var(--err);font-weight:600;}
.status-pending{color:var(--muted);}
.schedule-panel{flex:1.2;min-width:260px;background:var(--panel);border-radius:14px;max-height:480px;overflow-y:auto;padding:14px 18px;}
.schedule-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #334155;font-size:13px;}
.waktu{font-weight:600;color:var(--accent);}
.refresh-btn{padding:10px 18px;background:var(--accent);color:#0f172a;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:10px;}
.refresh-btn:hover{opacity:.85;}
</style>
</head>
<body>
<div class="header">
  <h1>Dashboard Posting Otomatis <span class="badge-demo">DEMO PUBLIK</span></h1>
  <div class="tanggal"><div id="tanggalMasehi"></div><div class="jam" id="jamSekarang"></div></div>
</div>
<button class="refresh-btn" onclick="muatData()">Perbarui Data</button>
<div class="panel status-panel"><span class="dot" id="statusDot"></span><span id="statusTeks">Memuat...</span></div>
<div class="cards" id="cards"></div>
<div class="progress-wrap">
  <div class="progress-label"><span>Progres Facebook</span><span id="fbPercentText">0%</span></div>
  <div class="progress-bar"><div class="progress-fill fb" id="fbBar"></div></div>
  <div class="progress-label" style="margin-top:14px"><span>Progres Instagram</span><span id="igPercentText">0%</span></div>
  <div class="progress-bar"><div class="progress-fill ig" id="igBar"></div></div>
</div>
<div class="main-content">
  <div class="table-wrap"><table>
    <thead><tr><th>Judul</th><th>Lokasi</th><th>Jadwal</th><th>FB</th><th>IG</th></tr></thead>
    <tbody id="tabelBody"></tbody>
  </table></div>
  <div class="schedule-panel" id="schedulePanel"></div>
</div>
<script>
// Ganti fungsi ini dengan fetch(URL_WEBAPP_ANDA) jika ingin data real-time
function getDummyData(){
  var contoh=[
    {judul:'Aqiqah Anak Pertama',lokasi:'Depok',jadwal:'20 Mei 2025 09:15',statusFB:'Posted',linkFB:'#',statusIG:'Posted',linkIG:'#',timestamp:Date.now()-3600000,sudahSelesai:true},
    {judul:'Paket Aqiqah Hemat',lokasi:'Bogor',jadwal:'20 Mei 2025 14:40',statusFB:'Belum Posting',linkFB:'',statusIG:'Belum Posting',linkIG:'',timestamp:Date.now()+7200000,sudahSelesai:false}
  ];
  return {statusSistem:true,waktuUpdate:new Date().toLocaleString('id-ID'),jadwalBerikutnyaTeks:'20 Mei 2025 14:40',jadwalBerikutnyaWaktu:'14:40',total:2,postedFB:1,postedIG:1,error:0,pending:1,postinganHariIni:2,rows:contoh};
}
function muatData(){ tampilkanData(getDummyData()); }
function statusHtml(s,l){ if(s==='Posted'&&l) return '<a href="'+l+'" class="link-posted" target="_blank">Posted</a>';
  if(s&&s.indexOf('Gagal')===0) return '<span class="status-error">'+s+'</span>';
  return '<span class="status-pending">'+(s||'Belum Posting')+'</span>'; }
function buatKartu(l,n){ return '<div class="card"><h2>'+n+'</h2><p>'+l+'</p></div>'; }
function tampilkanData(d){
  document.getElementById('statusDot').className='dot '+(d.statusSistem?'aktif':'nonaktif');
  document.getElementById('statusTeks').innerText=d.statusSistem?'Sistem berjalan normal':'Sistem tidak aktif';
  document.getElementById('cards').innerHTML=buatKartu('Total Naskah',d.total)+buatKartu('Hari Ini',d.postinganHariIni)+buatKartu('Belum Posting',d.pending)+buatKartu('Error',d.error);
  var pFB=d.total?Math.round(d.postedFB/d.total*100):0, pIG=d.total?Math.round(d.postedIG/d.total*100):0;
  document.getElementById('fbBar').style.width=pFB+'%'; document.getElementById('fbPercentText').innerText=pFB+'%';
  document.getElementById('igBar').style.width=pIG+'%'; document.getElementById('igPercentText').innerText=pIG+'%';
  var tbody=document.getElementById('tabelBody'); tbody.innerHTML='';
  d.rows.forEach(function(r){ var tr=document.createElement('tr');
    tr.innerHTML='<td>'+r.judul+'</td><td>'+r.lokasi+'</td><td>'+r.jadwal+'</td><td>'+statusHtml(r.statusFB,r.linkFB)+'</td><td>'+statusHtml(r.statusIG,r.linkIG)+'</td>';
    tbody.appendChild(tr); });
  var sp=document.getElementById('schedulePanel'); sp.innerHTML='';
  d.rows.filter(function(r){return !r.sudahSelesai;}).forEach(function(r){
    var div=document.createElement('div'); div.className='schedule-item';
    div.innerHTML='<span class="waktu">'+r.jadwal+'</span><span>'+r.judul+'</span>'; sp.appendChild(div); });
}
function perbaruiJam(){ var n=new Date();
  document.getElementById('jamSekarang').innerText=n.toLocaleTimeString('id-ID');
  document.getElementById('tanggalMasehi').innerText=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
muatData(); perbaruiJam(); setInterval(perbaruiJam,1000);
</script>
</body>
</html>
