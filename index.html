<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jasa Aqiqah Depok SOSMED</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>

.btn-gear {
  background: transparent;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: #cfd8ff;
  transition: transform 0.3s;
}
.btn-gear:hover { transform: rotate(90deg); }

.settings-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,10,0.4);
  z-index: 999;
}

.settings-panel {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 340px;
  max-width: 90%;
  background: rgba(10, 15, 40, 0.85);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(100,120,255,0.3);
  border-radius: 14px;
  padding: 20px;
  color: #eaeaff;
  z-index: 1000;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}

.settings-panel input {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
  border-radius: 6px;
  border: 1px solid #444;
  background: #10132a;
  color: #fff;
  box-sizing: border-box;
}

.settings-panel button.aksi {
  width: 100%;
  padding: 8px;
  margin: 4px 0;
  border: none;
  border-radius: 6px;
  background: #2b3570;
  color: #fff;
  cursor: pointer;
}
.settings-panel button.aksi:hover { background: #3b47a0; }

.settings-close {
  position: absolute;
  top: 8px; right: 12px;
  cursor: pointer;
  color: #aaa;
  font-size: 18px;
}
  
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#243244; --text:#e2e8f0; --muted:#94a3b8;
  --fb:#3b5998; --ig1:#f09433; --ig2:#dc2743; --ig3:#bc1888;
  --ok:#22c55e; --err:#ef4444; --accent:#38bdf8;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(160deg,#0f172a,#1e293b);color:var(--text);padding:24px;}
.header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-bottom:20px;}
.brand{display:flex;align-items:center;gap:14px;}
.logo{width:54px;height:54px;border-radius:50%;object-fit:cover;box-shadow:0 0 12px rgba(56,189,248,0.45);flex-shrink:0;}
.header h1{margin:0;font-size:24px;font-weight:700;background:linear-gradient(90deg,var(--accent),#818cf8);-webkit-background-clip:text;color:transparent;}
.tanggal{text-align:right;color:var(--muted);font-size:13px;}
.jam{font-size:24px;font-weight:700;color:var(--text);}
.panel{background:var(--panel);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,0.35);}
.status-panel{display:flex;align-items:center;gap:10px;font-weight:600;}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.aktif{background:var(--ok);box-shadow:0 0 8px var(--ok);}
.dot.nonaktif{background:var(--err);}
.info-panel p{margin:4px 0;font-size:14px;}
.info-panel .highlight{color:var(--accent);font-weight:600;}
.cards{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px;}
.card{flex:1;min-width:150px;background:var(--panel2);border-radius:14px;padding:18px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.3);}
.card h2{margin:0;font-size:28px;color:var(--accent);}
.card p{margin:6px 0 0;font-size:13px;color:var(--muted);}
.progress-wrap{background:var(--panel);border-radius:14px;padding:16px 20px;margin-bottom:16px;}
.progress-label{font-size:13px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:6px;}
.progress-bar{background:#334155;border-radius:8px;height:10px;overflow:hidden;}
.progress-fill{height:100%;border-radius:8px;transition:width .5s ease;width:0;}
.fb{background:var(--fb);} .ig{background:linear-gradient(90deg,var(--ig1),var(--ig2),var(--ig3));}
.main-content{display:flex;gap:16px;flex-wrap:wrap;}
.table-wrap{flex:3;min-width:320px;background:var(--panel);border-radius:14px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th,td{padding:12px;text-align:left;font-size:13px;border-bottom:1px solid #334155;}
th{background:var(--panel2);color:var(--accent);}
tr:hover{background:#22314654;}
.link-posted{color:var(--ok);font-weight:600;text-decoration:underline;}
.status-error{color:var(--err);font-weight:600;}
.status-pending{color:var(--muted);}
.schedule-panel{flex:1.2;min-width:260px;background:var(--panel);border-radius:14px;max-height:480px;overflow-y:auto;padding:14px 18px;}
.schedule-item{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid #334155;font-size:13px;gap:8px;}
.schedule-item:last-child{border-bottom:none;}
.schedule-item .waktu{font-weight:600;color:var(--accent);white-space:nowrap;}
.schedule-item .cek{color:var(--ok);font-weight:bold;}
.schedule-item .jam-icon{color:#f39c12;font-weight:bold;}
.refresh-btn{padding:10px 18px;background:var(--accent);color:#0f172a;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:10px;}
.refresh-btn:hover{opacity:.85;}
.refresh-info{font-size:12px;color:var(--muted);margin-bottom:14px;}
.badge-demo{display:inline-block;background:#334155;color:var(--accent);font-size:11px;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle;}

/* Tombol scroll atas/bawah */
.scroll-buttons{position:fixed;right:20px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:999;}
.scroll-buttons button{width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#0f172a;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.45);}
.scroll-buttons button:hover{opacity:.85;}

/* Footer */
.footer{text-align:center;margin-top:32px;padding:18px 10px;color:var(--muted);font-size:13px;border-top:1px solid #334155;}
.footer a{color:var(--accent);font-weight:600;text-decoration:none;}
.footer a:hover{text-decoration:underline;}

/* Tabel responsif untuk mobile: diubah jadi tata letak kartu */
@media (max-width:700px){
  .header{flex-direction:column;}
  .tanggal{text-align:left;}
  table, thead, tbody, th, td, tr{display:block;width:100%;}
  thead{display:none;}
  .table-wrap table tr{margin-bottom:12px;border:1px solid #334155;border-radius:12px;padding:6px 0;background:var(--panel2);}
  .table-wrap table td{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #334155;font-size:13px;}
  .table-wrap table td:last-child{border-bottom:none;}
  .table-wrap table td::before{content:attr(data-label);font-weight:600;color:var(--accent);margin-right:10px;}
}
</style>
</head>
<body>

<button id="btnGear" class="btn-gear" onclick="bukaPanelSettings()">⚙️</button>

<div class="settings-overlay" id="settingsOverlay" onclick="tutupPanelSettings()"></div>
<div class="settings-panel" id="settingsPanel">
  <span class="settings-close" onclick="tutupPanelSettings()">✕</span>

  <div id="loginBox">
    <h3>Login Pengaturan</h3>
    <input type="text" id="inputUser" placeholder="Username">
    <input type="password" id="inputPass" placeholder="Password">
    <button class="aksi" onclick="prosesLogin()">Masuk</button>
    <p id="pesanLogin" style="color:#ff8080;font-size:13px;"></p>
  </div>

  <div id="kontrolBox" style="display:none;">
    <h3>Panel Kontrol</h3>
<button class="aksi" onclick="jalankan('aktifkanSistem')">Aktifkan Sistem</button>
<button class="aksi" onclick="jalankan('nonaktifkanSistem')">Nonaktifkan Sistem</button>
<button class="aksi" onclick="jalankan('perbaikiLinkFoto')">Perbaiki Link Foto</button>
<button class="aksi" onclick="jalankan('perbaikiLokasi')">Perbaiki Lokasi</button>
<button class="aksi" onclick="jalankan('perbaikiIzinGambar')">Perbaiki Izin Gambar</button>
<button class="aksi" onclick="jalankan('refreshToken')">Refresh Token</button>
    <p id="pesanAksi" style="color:#8fffb0;font-size:13px;"></p>
  </div>
</div>  

<div class="header">
  <div class="brand">
    <img src="logo.png" alt="Logo Ishbiruu Media" class="logo">
    <h1>Jasa Aqiqah Depok SOSMED <span class="badge-demo">LIVE VIEW</span></h1>
  </div>
  <div class="tanggal">
    <div id="tanggalHijriMasehi"></div>
    <div class="jam" id="jamSekarang"></div>
  </div>
</div>

<div class="panel status-panel">
  <span class="dot" id="statusDot"></span>
  <span id="statusTeks">Memuat status sistem...</span>
</div>

<div class="panel info-panel">
  <p>Terakhir diperbarui: <strong id="waktuUpdate">-</strong></p>
  <p>Posting berikutnya: <span class="highlight" id="jadwalBerikutnya">-</span> <span id="countdown"></span></p>
</div>

<div class="cards" id="cards"></div>

<div class="progress-wrap">
  <div class="progress-label"><span>Progres Facebook</span><span id="fbPercentText">0%</span></div>
  <div class="progress-bar"><div class="progress-fill fb" id="fbBar"></div></div>
  <div class="progress-label" style="margin-top:14px"><span>Progres Instagram</span><span id="igPercentText">0%</span></div>
  <div class="progress-bar"><div class="progress-fill ig" id="igBar"></div></div>
</div>

<div class="main-content">
  <div class="table-wrap">
    <table>
      <thead><tr><th>Judul</th><th>Lokasi</th><th>Jadwal</th><th>Status FB</th><th>Status IG</th></tr></thead>
      <tbody id="tabelBody"></tbody>
    </table>
  </div>
  <div class="schedule-panel" id="schedulePanel"></div>
</div>

<footer class="footer">
  Ishbiruu Media &copy; 2026 - <a href="https://wa.me/6281413333513" target="_blank">0814-1333-3513</a>
</footer>

<div class="scroll-buttons">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Gulir ke atas">&#8679;</button>
  <button onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})" title="Gulir ke bawah">&#8681;</button>
</div>

<script>

function bukaPanelSettings() {
  document.getElementById('settingsOverlay').style.display = 'block';
  document.getElementById('settingsPanel').style.display = 'block';
}
function tutupPanelSettings() {
  document.getElementById('settingsOverlay').style.display = 'none';
  document.getElementById('settingsPanel').style.display = 'none';
}

var URL_WEBAPP = 'https://script.google.com/macros/s/AKfycbwBSgBloFuIdWx9MoltGAGfdFwLD7YsWj4tX6dLv3K3dI2OhTPJunDjCyFn11Z0oGmYiw/exec'; // ganti sesuai URL asli kamu

function panggilServer(action, data) {
  var payload = Object.assign({ action: action }, data || {});
  return fetch(URL_WEBAPP, {
    method: 'POST',
    body: JSON.stringify(payload)
  }).then(function(res) { return res.json(); });
}


function prosesLogin() {
  var user = document.getElementById('inputUser').value;
  var pass = document.getElementById('inputPass').value;
  document.getElementById('pesanLogin').innerText = 'Memeriksa...';

  panggilServer('login', { username: user, password: pass })
    .then(function(hasil) {
      if (hasil.sukses) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('kontrolBox').style.display = 'block';
      } else {
        document.getElementById('pesanLogin').innerText = hasil.pesan;
      }
    })
    .catch(function(err) {
      document.getElementById('pesanLogin').innerText = 'Error: ' + err.message;
    });
}

function jalankan(actionName) {
  document.getElementById('pesanAksi').innerText = 'Memproses...';
  panggilServer(actionName)
    .then(function(hasil) {
      document.getElementById('pesanAksi').innerText = hasil.pesan || 'Selesai.';
    })
    .catch(function(err) {
      document.getElementById('pesanAksi').innerText = 'Error: ' + err.message;
    });
}

function jalankan(namaFungsi) {
  document.getElementById('pesanAksi').innerText = 'Memproses...';
  panggilServer(namaFungsi)
    .then(function(hasil) {
      document.getElementById('pesanAksi').innerText = (hasil && hasil.pesan) || 'Selesai.';
    })
    .catch(function(err) {
      document.getElementById('pesanAksi').innerText = 'Error: ' + err.message;
    });
}
// GANTI dengan URL Web App Apps Script hasil deploy, akhiri dengan ?action=data
var URL_WEBAPP = 'https://script.google.com/macros/s/AKfycbwBSgBloFuIdWx9MoltGAGfdFwLD7YsWj4tX6dLv3K3dI2OhTPJunDjCyFn11Z0oGmYiw/exec?action=data';
var targetCountdown = null;

function muatData() {
  fetch(URL_WEBAPP)
    .then(function (res) {
      if (!res.ok) throw new Error('Status HTTP ' + res.status);
      return res.json();
    })
    .then(tampilkanData)
    .catch(function (err) {
      document.getElementById('statusTeks').innerText = 'Gagal memuat data: ' + err.message;
      document.getElementById('statusDot').className = 'dot nonaktif';
    });
}

function statusHtml(status, link) {
  if (status === 'Posted' && link) return '<a href="' + link + '" target="_blank" class="link-posted">Posted</a>';
  if (status && status.toString().indexOf('Gagal') === 0) return '<span class="status-error">' + status + '</span>';
  return '<span class="status-pending">' + (status || 'Belum Posting') + '</span>';
}

function buatKartu(label, nilai) {
  return '<div class="card"><h2>' + nilai + '</h2><p>' + label + '</p></div>';
}

function tampilkanData(data) {
  document.getElementById('statusDot').className = 'dot ' + (data.statusSistem ? 'aktif' : 'nonaktif');
  document.getElementById('statusTeks').innerText = data.statusSistem ? 'Sistem berjalan normal' : 'Sistem tidak aktif';
  document.getElementById('waktuUpdate').innerText = data.waktuUpdate;
  document.getElementById('jadwalBerikutnya').innerText = data.jadwalBerikutnyaTeks;

  if (data.jadwalBerikutnyaWaktu) {
    var now = new Date();
    var jm = data.jadwalBerikutnyaWaktu.split(':');
    targetCountdown = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(jm[0], 10), parseInt(jm[1], 10), 0);
  } else {
    targetCountdown = null;
    document.getElementById('countdown').innerText = '';
  }

  document.getElementById('cards').innerHTML =
    buatKartu('Total Naskah', data.total) +
    buatKartu('Postingan Hari Ini', data.postinganHariIni) +
    buatKartu('Belum Posting', data.pending) +
    buatKartu('Error', data.error);

  var persenFB = data.total > 0 ? Math.round((data.postedFB / data.total) * 100) : 0;
  var persenIG = data.total > 0 ? Math.round((data.postedIG / data.total) * 100) : 0;
  document.getElementById('fbBar').style.width = persenFB + '%';
  document.getElementById('fbPercentText').innerText = persenFB + '% (' + data.postedFB + '/' + data.total + ')';
  document.getElementById('igBar').style.width = persenIG + '%';
  document.getElementById('igPercentText').innerText = persenIG + '% (' + data.postedIG + '/' + data.total + ')';

  var tbody = document.getElementById('tabelBody');
  tbody.innerHTML = '';
  data.rows.forEach(function (row) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td data-label="Judul">' + row.judul + '</td>' +
      '<td data-label="Lokasi">' + row.lokasi + '</td>' +
      '<td data-label="Jadwal">' + row.jadwal + '</td>' +
      '<td data-label="Status FB">' + statusHtml(row.statusFB, row.linkFB) + '</td>' +
      '<td data-label="Status IG">' + statusHtml(row.statusIG, row.linkIG) + '</td>';
   tbody.appendChild(tr);
  });

  var schedulePanel = document.getElementById('schedulePanel');
  schedulePanel.innerHTML = '';
  var antrean = data.rows
    .filter(function (r) { return r.timestamp && !r.sudahSelesai; })
    .sort(function (a, b) { return a.timestamp - b.timestamp; });

  if (antrean.length === 0) {
    schedulePanel.innerHTML = '<div class="schedule-item">Tidak ada naskah terjadwal.</div>';
  }

  antrean.forEach(function (item) {
    var icon = item.timestamp < Date.now() ? '<span class="jam-icon">&#9203;</span>' : '<span class="cek">&#10003;</span>';
    var div = document.createElement('div');
    div.className = 'schedule-item';
    div.innerHTML = '<div><span class="waktu">' + item.jadwal + '</span> - ' + item.judul + '</div>' + icon;
    schedulePanel.appendChild(div);
  });
}

function konversiKeHijri(tanggal) {
  var namaBulanHijri = ['Muharram','Safar','Rabiul Awal','Rabiul Akhir','Jumadil Awal',
    'Jumadil Akhir','Rajab','Syaban','Ramadhan','Syawal','Dzulqaidah','Dzulhijjah'];

  var day = tanggal.getDate();
  var month = tanggal.getMonth() + 1;
  var year = tanggal.getFullYear();

  var m = month, y = year;
  if (m < 3) { y -= 1; m += 12; }
  var a = Math.floor(y / 100);
  var b = 2 - a + Math.floor(a / 4);
  var jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + b - 1524;

  var l = jd - 1948440 + 10632;
  var n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  var j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) +
          Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) -
          Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;

  var hMonth = Math.floor((24 * l) / 709);
  var hDay = l - Math.floor((709 * hMonth) / 24);
  var hYear = 30 * n + j - 30;

  return hDay + ' ' + namaBulanHijri[hMonth - 1] + ' ' + hYear + ' H';
}

function perbaruiJam() {
  var now = new Date();
  document.getElementById('jamSekarang').innerText = now.toLocaleTimeString('id-ID');

  var opsiMasehi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  var tanggalMasehi = now.toLocaleDateString('id-ID', opsiMasehi);

  var tanggalHijri = konversiKeHijri(now);

  document.getElementById('tanggalHijriMasehi').innerText = tanggalMasehi + ' | ' + tanggalHijri;

  if (targetCountdown) {
    var selisih = targetCountdown - now;
    if (selisih > 0) {
      var jam = Math.floor(selisih / 3600000);
      var menit = Math.floor((selisih % 3600000) / 60000);
      var detik = Math.floor((selisih % 60000) / 1000);
      var teks = (jam < 10 ? '0' : '') + jam + ':' + (menit < 10 ? '0' : '') + menit + ':' + (detik < 10 ? '0' : '') + detik;
      document.getElementById('countdown').innerText = '(' + teks + ')';
    } else {
      document.getElementById('countdown').innerText = '';
    }
  }
}
muatData();
perbaruiJam();
setInterval(muatData, 15000);
setInterval(perbaruiJam, 1000);
</script>
</body>
</html>
